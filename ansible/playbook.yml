# ═══════════════════════════════════════════════════════════════
# Ansible — CrowdFundIn Deployment Playbook (AWS EC2)
# Strategy: rsync local project to EC2 (faster than git clone)
# then docker compose up
# ═══════════════════════════════════════════════════════════════

---
- name: Deploy CrowdFundIn to AWS EC2
  hosts: app_servers
  become: yes

  vars:
    project_name: crowdfundin
    project_dir: /home/ubuntu/devops-main-1
    local_project_dir: "{{ playbook_dir }}/../"
    app_port: 3000

  tasks:

    # ── Pre-requisites ─────────────────────────────────────────
    - name: Wait for SSH to be available
      wait_for_connection:
        delay: 5
        timeout: 60
      tags: always

    - name: Verify Docker is running
      service:
        name: docker
        state: started
        enabled: yes
      tags: setup

    - name: Ensure project directory exists
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
      tags: deploy

    # ── Sync Project Files ────────────────────────────────────
    - name: Sync project files to EC2 (rsync — fast, skips .git & node_modules)
      synchronize:
        src: "{{ local_project_dir }}"
        dest: "{{ project_dir }}/"
        delete: yes
        recursive: yes
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=jenkins-cli.jar"
          - "--exclude=terraform/.terraform"
          - "--exclude=terraform/*.tfstate*"
          - "--exclude=terraform/terraform.tfvars"
          - "--exclude=*.pem"
          - "--exclude=.env"
          - "--exclude=prometheus-data"
          - "--exclude=grafana-data"
      tags: deploy

    - name: Set correct ownership on project directory
      file:
        path: "{{ project_dir }}"
        owner: ubuntu
        group: ubuntu
        recurse: yes
      tags: deploy

    # ── Write .env file ────────────────────────────────────────
    - name: Create .env file on remote server
      copy:
        dest: "{{ project_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: '0600'
        content: |
          MONGODB_URI={{ mongodb_uri }}
          JWT_SECRET={{ jwt_secret }}
          NODE_ENV=production
          VITE_API_URL=http://{{ ansible_host }}:5000
          RAZORPAY_KEY_ID=rzp_test_RPU47z8z3YzA53
          RAZORPAY_KEY_SECRET=hEfb56TfcNovEqVFj3RVpWxh
          EMAIL_USER=bharanidharank.23cse@kongu.edu
          EMAIL_PASS=wweekjioehjiappg
          FRONTEND_URL=http://{{ ansible_host }}:3000
          MAX_FILE_SIZE=5000000
      tags: deploy

    # ── Docker Compose ─────────────────────────────────────────
    - name: Stop existing containers (clean slate)
      command: docker compose down --remove-orphans
      args:
        chdir: "{{ project_dir }}"
      become_user: ubuntu
      ignore_errors: yes
      tags: deploy

    - name: Build and start application stack
      command: docker compose up -d --build
      args:
        chdir: "{{ project_dir }}"
      become_user: ubuntu
      tags: deploy

    # ── Verification ───────────────────────────────────────────
    - name: Wait for frontend to be ready
      wait_for:
        host: localhost
        port: "{{ app_port }}"
        delay: 10
        timeout: 120
      tags: verify

    - name: Wait for Jenkins to start (port 8080)
      wait_for:
        host: localhost
        port: 8080
        delay: 15
        timeout: 180
      tags: verify

    - name: Get Jenkins initial admin password
      command: docker exec devops-jenkins cat /var/jenkins_home/secrets/initialAdminPassword
      register: jenkins_password
      ignore_errors: yes
      become_user: ubuntu
      tags: verify

    - name: Show running containers
      command: docker ps --format "table {% raw %}{{.Names}}\t{{.Status}}\t{{.Ports}}{% endraw %}"
      register: docker_ps
      become_user: ubuntu
      tags: verify

    - name: Display deployment summary
      debug:
        msg: |
          ═══════════════════════════════════
           CrowdFundIn Deployment Complete!
          ═══════════════════════════════════
          Frontend   → http://{{ ansible_host }}:3000
          Backend    → http://{{ ansible_host }}:5000
          Jenkins    → http://{{ ansible_host }}:8080
          Prometheus → http://{{ ansible_host }}:9090
          Grafana    → http://{{ ansible_host }}:3001
          ───────────────────────────────────
          Jenkins Initial Admin Password:
          {{ jenkins_password.stdout | default('(already configured — check jenkins-data volume)') }}
          ───────────────────────────────────
          Containers:
          {{ docker_ps.stdout }}
      tags: verify
